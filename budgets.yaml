# Пределы расхода. Файл необязателен: без него ведётся только учёт, а раннер
# работает как обычно. Каждый предел — значение и режим; режим по умолчанию warn.
#
#   warn — сказать и продолжить
#   stop — не начинать работу, упирающуюся в этот предел
#
# Числа здесь стартовые и взяты по замеру, а не из головы: прогон стоил
# $0.09–0.36, задача с ответом человека — около $0.55 (docs/notes/budgets.md,
# docs/notes/stage-2-smoke.md). Все три предела с запасом в несколько раз и все
# в режиме warn: сперва посмотреть, где офис живёт на самом деле, и только потом
# что-то останавливать.

# Сумма по задаче за всё время. Дорожает она кругами «правки → ревью»:
# круг — это два прогона.
per_task: { usd: 5, on_exceed: warn }

# Расход роли за календарные сутки — страховка от раннера, застрявшего
# на очереди.
#
# Число подтверждено нагрузочным прогоном: очередь из десяти задач стоила $10.11
# на две роли, то есть рабочий день роли — это единицы долларов, а не десятки.
# Режим warn: тот, кто вписал одно число, не должен обнаружить, что раннер молча
# перестал брать задачи. См. docs/notes/stage-4-load.md.
per_role_daily: { usd: 20, on_exceed: warn }

# Цена одного прогона. Режим только warn: цена известна, когда работа уже
# сделана и оплачена, — прерывать нечего. Жёсткая граница прогона задаётся
# числом шагов, limits.max_turns в role.yaml.
per_run: { usd: 1, on_exceed: warn }

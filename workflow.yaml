# Граф состояний конвейера: статусы, роли и то, куда роль двигает задачу
# по каждому исходу прогона.
#
# Читает его раннер, агент не видит: решения о переходах принимает код, а не промпт
# (DESIGN.md §2.1). Всё, для чего здесь нет правила, раннер делать не вправе.
#
# Статус — узел workflow трекера, а не колонка доски: колонка группирует статусы
# и живёт в настройках доски, которых у одного проекта бывает несколько. Раннер
# о досках не знает ничего; раскладку досок описывает docs/notes/jira-setup.md.
#
# Имена статусов — те же строки, что в трекере. Для JIRA сопоставление имён
# задаётся отдельно, в ${OFFICE_HOME}/tracker.yaml (status_map): файл машинный,
# в репозитории лежит только образец. Идентификаторы переходов там не хранятся —
# их раннер спрашивает у самой JIRA перед каждым переводом.

# Backlog и Done — человеческие статусы: «до триажа» и «смержено». Ни одна роль
# их не читает и в них не пишет, но задачи в них есть, и `runner ls` покажет их
# тоже. Валидатор статусу без роли не удивляется.
#
# Analysis — очередь аналитика, и переводит туда задачу человек: этим он говорит
# «берите в работу». Backlog остаётся территорией человека и автоматически
# не читается никем.
statuses: [Backlog, Analysis, Ready, InProgress, Review, Approved, Done, Blocked]

# Статусы, в которых жизнь задачи кончается: работа слита, рабочая папка больше
# не нужна.
#
# `Approved` терминальным больше не является: теперь это «разбор прошёл, PR
# открыт». Задача живёт до слияния, а слияние делает человек — и рабочая папка
# живёт вместе с ней, потому что вернуться в неё может понадобиться конфликт.
terminal: [Done]

# Порядок обхода ролей в цикле без --role. Задаётся явно: порядок ключей YAML-карты
# не сохраняется, и «по алфавиту» было бы совпадением, а не правилом.
#
# Порядок обратный ходу конвейера, и это намеренно: сначала разгрузить его с конца,
# потом брать новое. Ревьюер освобождает Review, implementer — Ready, аналитик
# только добавляет работы остальным. Прямой порядок копил бы очередь на разбор.
tick_order: [reviewer, implementer, analyst]

roles:
  analyst:
    # Рабочего статуса нет — по тому же правилу, что у ревьюера (см. ниже):
    # прогон длится минуты, параллелить аналитика незачем, занятость выражена
    # арендой.
    reads_from: Analysis
    outcomes:
      # Аналитик закончил план — дальше его исполняют. Карта названа явно, хотя
      # маршрут в ней один: без неё `next_owner: reviewer` от аналитика уехал бы
      # в Ready молча, а с ней упрётся в правило «маршрута нет» и попадёт к человеку.
      done:
        to: Ready
        by_next_owner:
          implementer: Ready
      # Сюда же уходит «план готов, утвердите»: маршрута с флагом для этого нет
      # и не нужно — оба пути ведут в Blocked, а ответ человека вернёт задачу
      # тому, кто спросил.
      needs_human: { to: Blocked, human: true }
      # Постановка описывает несколько независимых сущностей — предложение
      # разбивки лежит в самом отчёте (result.json.split), маршрут тот же,
      # что у needs_human: Blocked — это и есть статус «роль спросила
      # человека», раздваивать его незачем.
      split:       { to: Blocked, human: true }
      blocked:     { to: Analysis, attempts: +1 }
      failed:      { to: Analysis, attempts: +1 }

  implementer:
    reads_from: Ready       # откуда берёт задачи
    # Рабочий статус — опция роли, и у implementer'а он есть по двум причинам,
    # ни одна из которых не про доску (доска группирует статусы сама, колонок
    # на этом не сэкономить):
    #
    #   1. это единственный CAS, который даёт JIRA, — переход, доступный ровно
    #      из одного статуса. Только роль с рабочим статусом можно однажды
    #      запустить в двух раннерах (docs/contracts/tracker-protocol.md);
    #   2. «в работе» у разработчика человек ждёт увидеть в трекере, не открывая
    #      карточку и не спрашивая раннера.
    #
    # Роль без него работает в том же статусе, из которого читает, а «сейчас
    # занят» означает живую аренду.
    working: InProgress
    outcomes:
      # План разошёлся с кодом — это не повод для самодеятельности: задача
      # возвращается аналитику, а не правится по месту.
      done:
        to: Review
        by_next_owner:
          reviewer: Review
          analyst: Analysis
      needs_human: { to: Blocked, human: true }
      # implementer split не эмитит никогда (это решение только analyst'а) —
      # маршрут здесь только ради Workflow.Validate(), который требует
      # перехода для каждого исхода контракта у каждой роли графа.
      split:       { to: Blocked, human: true }
      blocked:     { to: Ready, attempts: +1 }
      failed:      { to: Ready, attempts: +1 }

  reviewer:
    reads_from: Review
    # Рабочего статуса нет, и это решение, а не экономия. Занятость уже выражена
    # арендой: она авторитетна, у неё есть срок, на ней стоит reap, — а рабочий
    # статус её дублирует. Дублировать стоит там, где это что-то даёт: у роли,
    # которую однажды запустят в двух раннерах, и у той, чьё «в работе» человек
    # ждёт увидеть. Разбор длится минуты, параллелить ревьюера незачем, и кто его
    # держит — видно в `runner ls`, а в JIRA полем office_owner на карточке.
    outcomes:
      done:
        to: Approved        # маршрут по умолчанию: разбор кончился, работа принята
        # Куда именно ведёт `done`, решает граф по next_owner из отчёта. Агент
        # называет следующего владельца, но карту пишет человек: значения, которого
        # в карте нет, хватает ровно на маршрут по умолчанию.
        by_next_owner:
          implementer: Ready
          human: Approved
          # Ревьюер вправе усомниться в самом плане, а не только в коде.
          analyst: Analysis
      needs_human: { to: Blocked, human: true }
      # reviewer split не эмитит никогда — тот же формальный маршрут, что и
      # у implementer, чисто ради Workflow.Validate().
      split:       { to: Blocked, human: true }
      # Возврат в свой же статус: разбор не состоялся, задача ждёт следующего.
      blocked:     { to: Review, attempts: +1 }
      failed:      { to: Review, attempts: +1 }

# PR-проход: что делает офис с задачей, дошедшей до конца разбора.
#
# Блок отдельный, а не роль в `roles:`, и это не оформление. Роль в `roles:`
# валидатор потребует в `tick_order`, а обход полезет за `roles/office/role.yaml`
# — те же грабли, из-за которых на этапе 4 аналитика заводили на шаг раньше
# плана. Агента у прохода нет: работу делает раннер, файла роли не будет никогда.
#
# `role` — имя, которым подписаны записи прохода. Маркер без роли невалиден,
# а имя — конфигурация: в коде раннера его нет.
#
# По умолчанию сливает человек. На проекте с явным auto_merge.enabled
# (projects.local.yaml) — сливает офис сам, детерминированным кодом, тем же
# проходом: гейт — Approved плюс актуальная база, без роли и без окна ожидания.
pr:
  role: office
  from: Approved            # разбор прошёл — пора открывать PR
  merged: Done              # человек слил
  conflict: Ready           # ветка не сливается: это работа, а не провал
  closed: Blocked           # PR закрыли без слияния — это разговор с человеком

limits:
  max_attempts: 3           # исчерпав попытки, задача уходит в Blocked к человеку
  max_return_rounds: 3      # отчётов одной роли одному и тому же владельцу подряд
  lease_margin_sec: 300     # аренда = таймаут роли + этот запас

  # Сколько раз подряд прогон может не дожить до отчёта. Считается отдельно
  # от попыток: смерть раннера — не провал агента (перезагрузили машину, кончилось
  # место, уронили процесс), и человека по такому поводу зовут с другим разговором.
  # Считает не поле в трекере, а маркеры event:lease-expired в самом тикете.
  max_lease_expiries: 3

  # Сколько раз подряд может не удаться публикация ветки. Тоже отдельно и по той
  # же причине: сломанный remote, кончившийся токен, отказ сервера — не вина
  # агента, и попытки на них тратить незачем. Считает маркеры event:push-failed.
  max_push_failures: 3

  # Сколько прогонов роли подряд может не дойти до результата. Считает маркеры
  # event:agent-unavailable («не начинал»: обрыв связи, отказ API, окно подписки)
  # и event:run-truncated («не успел»: предел шагов или таймаут) — одним
  # счётчиком на оба.
  #
  # Счётчик общий по существу, а не для краткости: следствие у этих бед одно —
  # прогона как работы не было, — и причина одна. Два раздельных счётчика
  # чередование обошло бы: не начался, оборвался, снова не начался — и ни один
  # не дошёл бы до предела, пока задача крутится вечно. События в записях при
  # этом разные, и человек видит, что именно было.
  max_idle_runs: 3

  # Сколько раз подряд forge может отказать в мерже (auto_merge.enabled) при
  # локально чистом состоянии, прежде чем задачу отдадут человеку. Считает
  # маркеры event:merge-refused.
  max_merge_refusals: 3

  # Сколько раз подряд PR-проход может вернуть задачу, не сдвинув её вперёд —
  # продвинувшейся базой или отказом forge, — прежде чем задачу отдадут человеку.
  # Считает маркеры event:merge-conflict и event:merge-refused одним счётчиком,
  # и по той же причине, что max_idle_runs: чередование их не обходит. Два
  # раздельных предела задача обошла бы кругом «отказ → база уехала → отказ»,
  # не достигнув ни одного.
  max_pr_returns: 3

# Что делает раннер, увидев ответ человека на задачу в Blocked.
#
# Маршрута по умолчанию нет: задача возвращается в очередь той роли, которая
# говорила последней, — спросил reviewer, ему и вернётся. Запасной нужен только
# на случай, когда роли из маркера в графе больше нет.
human_reply:
  fallback: Ready
  reset_attempts: true      # человек снял причину; старые попытки к новой постановке не относятся

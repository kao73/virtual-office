# Проекты-клиенты: ключ проекта в трекере → где его репозиторий и как звать ветки.
# Задачу проекта, которого здесь нет, раннер в работу не берёт: ему негде взять
# репозиторий и некуда пушить.
#
# Секретов здесь нет и не будет: токен пуша живёт в окружении.
#
# `tracker` обязателен: раннер запускается с одним трекером и работает только
# со своими проектами. Чужие он не спрашивает и их рабочие папки не убирает.
#
# `forge` необязателен: пусто — офис pull request не открывает, и PR-проход
# для такого проекта вырождается в переход сразу в терминальный статус.
#
# Значения ниже — полигонные: `OFFICE` читает файловый трекер (`--tracker mock`),
# `VO` — проект на локальной JIRA. Оба указывают на один bare-репозиторий на этой
# машине, и путь к нему у каждого свой: на другой машине его придётся заменить.
# Именно поэтому маркер прогона честно скажет `config:…-dirty`, если файл правили
# под себя и не закоммитили.

OFFICE:
  repo_url: /Users/aleksejkolesnikov/IdeaProjects/office-polygons/client.git
  default_branch: master
  branch_prefix: agent/
  tracker: mock
  # worktree_root не задан — значит ${OFFICE_HOME}/worktrees/<проект>.
  # forge не задан — локальный bare-репозиторий, открывать PR негде.

VO:
  repo_url: /Users/aleksejkolesnikov/IdeaProjects/office-polygons/client.git
  default_branch: master
  branch_prefix: agent/
  tracker: jira

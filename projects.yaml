# Проекты-клиенты: ключ проекта в трекере → где его репозиторий и как звать ветки.
# Задачу проекта, которого здесь нет, раннер в работу не берёт: ему негде взять
# репозиторий и некуда пушить.
#
# Значения ниже — предварительные: настоящий ключ проекта появится на шаге 5,
# когда полигон JIRA будет настроен, а repo_url — на шаге 3, вместе с тестовым
# репозиторием. Секретов здесь нет и не будет: токен пуша живёт в окружении.

OFFICE:
  repo_url: https://github.com/kao73/office-sandbox.git
  default_branch: master
  branch_prefix: agent/
  # worktree_root не задан — значит ${OFFICE_HOME}/worktrees/<проект>.

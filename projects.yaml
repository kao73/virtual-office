# Проекты-клиенты офиса: имена и то, что у них не зависит от машины.
#
# Здесь только половина. Вторая — где эти проекты лежат на конкретной машине,
# в каком трекере их задачи и куда открывать pull request — живёт
# в ${OFFICE_HOME}/projects.local.yaml. Граница не вкусовая: репозиторий
# описывает офис, ${OFFICE_HOME} — инстанс, и всё, что правят при заведении
# новой машины, обязано лежать вне репозитория. Иначе правка под себя пачкает
# рабочее дерево, и метка прогона `config:…-dirty` перестаёт что-либо значить.
#
# Загрузчик за этим следит: машинный ключ (repo_url, worktree_root, tracker,
# forge), встреченный здесь, — отказ при старте с указанием, куда он переехал.
#
# Задачу проекта, которого здесь нет, раннер в работу не берёт: ему негде взять
# репозиторий и некуда пушить.

# defaults — зарезервированное имя, не проект. Слой repo-wide умолчаний
# network/tools (уровень 1 слоистой модели, docs/contracts/role-sandbox-permissions.md):
# применяется к прогону любой роли на любом проекте объединением (union),
# а не переопределением — ни один более специфичный слой (проект, машина,
# роль) не может убрать то, что здесь названо. Оттого сюда не кладят
# default_branch/branch_prefix — это не проект, и загрузчик отдельно
# проверяет, что их здесь нет.
#
# Симметрично, ${OFFICE_HOME}/projects.local.yaml вправе иметь свой ключ
# defaults — машинный слой (уровень 3), тем же принципом.
defaults:
  network:
    # Docker Hub — проверено эмпирически 2026-08-27 (пустая одноразовая
    # песочница sbx → голая попытка → добавление хостов по факту ошибки),
    # docs/notes/followup-network-and-permissions.md, «Находка 1».
    - registry-1.docker.io
    - auth.docker.io
    - "*.docker.io"
    - production.cloudfront.docker.com   # CDN раздачи blob'ов, не cloudflare.docker.com
    - "*.cloudfront.docker.com"
    # GitHub — проверено эмпирически 2026-08-27, тем же способом (throwaway
    # sbx-песочница + голая попытка + добавление хостов по факту ошибки).
    # `git clone` по HTTPS упёрся только в github.com; `sbx policy log`
    # после успешного клона не показал ни одного обращения к api.github.com,
    # codeload.github.com, raw.githubusercontent.com, objects.githubusercontent.com
    # или *.githubusercontent.com — эти хосты сюда не добавлены как
    # непроверенные (см. followup-network-and-permissions.md).
    - github.com
    # npm — проверено эмпирически 2026-08-27. `npm view left-pad` (резолв
    # метаданных и tarball-ссылки) целиком уложился в registry.npmjs.org;
    # *.npmjs.org в policy log не всплыл, не добавлен как непроверенный.
    - registry.npmjs.org
    # PyPI — проверено эмпирически 2026-08-27; закрывает и нужду ролей
    # analyst/implementer/reviewer (их собственный network.allow с этими
    # же хостами убирается из role.yaml задачей 9, если она подтвердит это
    # здесь актуальным). `uv run --with pytest` потребовал ровно эти два
    # хоста; *.pythonhosted.org в policy log не всплыл, не добавлен.
    - pypi.org
    - files.pythonhosted.org
    # Go modules — проверено эмпирически 2026-08-27. `go get` потребовал
    # module-proxy и sumdb-хосты порознь (разные попытки, разные ошибки);
    # *.golang.org в policy log не всплыл, не добавлен.
    - proxy.golang.org
    - sum.golang.org
    # GitHub Container Registry — проверено эмпирически 2026-09-13, тем же
    # способом (throwaway sbx-песочница, `docker pull ghcr.io/astral-sh/uv`
    # голой попыткой упал 403 на ghcr.io, после allow — второй 403 на
    # blob-CDN pkg-containers.githubusercontent.com; с обоими пулл прошёл
    # целиком). Найдено при разборе, почему Playwright e2e не проходил
    # в песочнице (backend-образ EXP собирает `uv` именно отсюда).
    - ghcr.io
    - pkg-containers.githubusercontent.com
    # GitHub Releases — проверено эмпирически 2026-09-13, тем же способом:
    # `curl https://bun.sh/install | bash` резолвится в редирект на
    # github.com/.../releases/latest/download/..., а сам бинарник качается
    # с release-assets.githubusercontent.com — хост новее и не совпадает
    # с непроверенным списком-догадкой выше (`objects.githubusercontent.com`
    # так и не понадобился ни разу).
    - release-assets.githubusercontent.com
    # Microsoft Container Registry (образ mcr.microsoft.com/playwright) —
    # проверено эмпирически 2026-09-13, тем же способом. Blob-CDN отдаётся
    # с регионального поддомена (`westeurope.data.mcr.microsoft.com` на этой
    # машине) — заведён вайлдкардом по образцу *.cloudfront.docker.com, а не
    # точным хостом, потому что регион — свойство запроса, не сервиса.
    - mcr.microsoft.com
    - "*.data.mcr.microsoft.com"
    - bun.sh
    # Playwright browser download (`bunx playwright install chromium`, путь
    # без Dockerfile.playwright — так фактически проверял reviewer) —
    # проверено эмпирически 2026-09-13, той же throwaway-песочницей.
    # `playwright.azureedge.net` (упомянут ревьюером) отдаёт только 307-редирект
    # и сам файл не раздаёт; реальные хосты, отдающие сам архив с браузером
    # (обнаружены по сообщению об ошибке загрузки, а не догадкой), —
    # эти два, попытка идёт по ним по очереди.
    - cdn.playwright.dev
    - playwright.download.prss.microsoft.com
    # apt (Ubuntu-пакеты внутри образа mcr.microsoft.com/playwright, нужен
    # Dockerfile.playwright для `unzip`) — проверено эмпирически 2026-09-13
    # на arm64-машине: `apt-get update` резолвился в ports.ubuntu.com
    # («ports» — архитектурный мирror, не архитектура х86_64/archive.ubuntu.com,
    # которая здесь не проверялась) и deb.nodesource.com (сторонний источник,
    # уже прописанный в sources.list самого базового образа).
    - ports.ubuntu.com
    - deb.nodesource.com
  tools:
    deny:
      # Общие для всех ролей: работу с origin, переключение веток и
      # подмену личности коммитов ведёт раннер, а не агент. Форма со
      # звёздочкой МЕЖДУ "git" и подкомандой (не по краям) — единственная,
      # что ловит и флаговую форму: проверено эмпирически 2026-08-27,
      # docs/contracts/role-sandbox-permissions.md.
      - "Bash(git *push*)"
      - "Bash(git *remote*)"
      - "Bash(git *checkout*)"
      - "Bash(git *switch*)"
      - "Bash(git *branch*)"
      - "Bash(git *worktree*)"
      - "Bash(git *config*)"
      # Переписывание истории — та же природа, что у общих семи строк
      # выше: чужая, уже опубликованная работа не должна переписываться
      # ни одной ролью.
      - "Bash(git *filter-branch*)"
      - "Bash(git *filter-repo*)"
      # Рекурсивное/принудительное удаление — тем же приёмом: звёздочка
      # вокруг флага, а не по краям, чтобы не зависеть от его формы
      # (короткая -rf/-fr или длинная --recursive/--force) и места
      # (до или после пути).
      - "Bash(rm *-r*)"
      - "Bash(rm *-f*)"
      - "Bash(rm *--recursive*)"
      - "Bash(rm *--force*)"

OFFICE:
  default_branch: master
  branch_prefix: agent/

VO:
  default_branch: master
  branch_prefix: agent/

EXP:
  default_branch: main
  branch_prefix: agent/

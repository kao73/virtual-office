# Машиночитаемая спецификация роли. Агент её не видит: адаптер переводит её
# в нативные механизмы Claude Code.
name: reviewer

prompt: role.md
includes:
  - ../_base/base.md

skills: [comet, comet-native]

# Синтаксис правил — как у claude: пробел перед * значим,
# Bash(git *diff*) поймал бы и git diff-index, и git -c x diff.
tools:
  # tools.allow не защищает технически (измерено 2026-08-27, «Находка 2»,
  # docs/notes/followup-network-and-permissions.md) — единственная реальная
  # граница про запись всегда была в tools.deny/defaults.tools.deny, не здесь.
  # До живого прогона Задачи 22 (docs/superpowers/plans/2026-08-30-role-comet-native-workflow.md)
  # reviewer не получал Edit/Write в allow вовсе — «не пишет код» держалось
  # запретом git add/commit/restore ниже. Пересмотрено: reviewer теперь тоже
  # умеет точечно чинить и коммитить (roles/reviewer/role.md, «Точечный фикс
  # вместо возврата») — тем же путём, что implementer/analyst, границу держит
  # текст role.md, а не ACL. Технической разницы между тремя ролями по записи
  # больше нет: она вся в том, что каждой role.md разрешает по смыслу.
  allow:
    - Read
    - Grep
    - Glob
    - Edit
    - Write
    - "Bash(*)"

  # Общие для всех ролей (push/remote/checkout/switch/branch/worktree/config,
  # переписывание истории filter-branch/filter-repo, rm -r/-f) —
  # в roles/_base/base.yaml. Роль-специфичного deny у reviewer'а
  # больше нет: add/commit/restore, что раньше стояли здесь, разрешены —
  # см. комментарий у tools.allow выше. rebase/reset, в отличие от implementer'а
  # и analyst'а, не запрещены: решение владельца 2026-09-17 — оставить как есть.

hooks:
  stop:
    - hooks/require-result.sh   # не даёт завершиться без валидного result.json
  pre_tool_use:
    - matcher: "Write|Edit"
      command: skills/comet/scripts/comet-hook-router.mjs --platform claude --project-root "$WORKDIR"

# Пределы растут вместе с implementer'ом, но не обязаны совпадать буквально —
# теперь уже по замеру, а не по незнанию. Предположение было «разбор дешевле
# работы»; шестнадцать живых разборов (шаг 7, stage-3-smoke.md) показали
# обратное: $0.39 против $0.31 у автора и 107 секунд против 83 — при меньшем
# числе шагов. Ревьюер читает дифф целиком, поднимает окружение и гоняет тесты,
# то есть делает работу заново, не написав ни строки. Занижать пределы тем более
# незачем: обрезанный посреди разбора отчёт дороже.
#
# Предел шагов — усечение, а не провал: прогон, упёршийся в max_turns или
# в таймаут, даёт event:run-truncated, попытка не тратится, а следующий прогон
# продолжает в той же рабочей папке. Серию таких прогонов считает отдельный
# счётчик (limits.max_idle_runs в workflow.yaml); подробности — в контракте
# docs/contracts/tracker-protocol.md.
limits:
  # 50 не хватило живому разбору EXP-12 (2026-09-09, full-stack диф от
  # implementer'а на неурезанной постановке) — усёкся на 51-м шаге при 546 с
  # из 1800 разрешённых: снова упёрлись в шаги, не в таймаут. Тот же случай,
  # что увеличил implementer'а (roles/implementer/role.yaml) — диф крупнее
  # обычного, поднято тем же порядком, вслепую, с запасом.
  #
  # 100 тоже не хватило: живой разбор EXP-5 (2026-09-13), после починки
  # сетевой политики (общий allowlist сети — тогда в projects.yaml, теперь roles/_base/base.yaml), впервые реально
  # гонял Playwright e2e вместо того, чтобы принять его недоступность как
  # известный gap — установка Bun, скачивание браузера (~300 МиБ) и сам
  # e2e-прогон стоят шагов не меньше, чем у implementer'а. Усёкся на 101-м
  # шаге. Поднято тем же порядком, вслепую, с запасом.
  max_turns: 180
  timeout_sec: 4500

result_file: .agent/result.json

        исполняются на машине. Файл спорит сам с собой — та же форма ложного
        «единственного», что чинили кругом раньше в этом же файле.
      truncated: false
  - id: A25
    source: specs/config-per-machine/spec.md
    text: "Тест на перекрытие бюджетов: названный предел заменён, не названный

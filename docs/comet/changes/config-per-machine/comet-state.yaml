  - id: A2
    source: specs/config-per-machine/spec.md
    text: "**Репозиторий описывает офис. `${OFFICE_HOME}` описывает инстанс.**"
    result: passed
    reason:
      text: Формулировка границы проведена сквозь код и документы.
      truncated: false
  - id: A3
    source: specs/config-per-machine/spec.md
    text: "В репозитории остаётся то, что одинаково у любого, кто поднимет этот
      офис: роли, граф переходов, хуки, скиллы, имена проектов и их неизменные
      свойства, дефолтные бюджеты. В `${OFFICE_HOME}` уезжает всё, что правят,
      заводя новую машину или второй инстанс: пути, адреса, учётки,
      идентификаторы полей JIRA."
    result: passed
    reason:
      text: В репозитории машинных значений не осталось; они в ~/.office.
      truncated: false
  - id: A4
    source: specs/config-per-machine/spec.md
    text: "Граница держится не памятью того, кто правит файл, а кодом: загрузчик
      отвергает машинный ключ, встреченный в репозитории."
    result: passed
    reason:
      text: checkOfficeHalf зовётся первым в LoadProjects; плюс тест по файлам офиса.
      truncated: false
  - id: A5
    source: specs/config-per-machine/spec.md
    text: "`projects.yaml` в репозитории называет проекты и их неизменные свойства —
      `default_branch` и `branch_prefix`. Больше в нём ничего нет."
    result: passed
    reason:
      text: projects.yaml — только default_branch и branch_prefix; officeProject
        больше ничего не примет.
      truncated: false
  - id: A6
    source: specs/config-per-machine/spec.md
    text: "`${OFFICE_HOME}/projects.local.yaml` даёт машинные ключи каждому проекту:
      `repo_url`, `worktree_root`, `tracker`, `forge`."
    result: passed
    reason:
      text: machineProject даёт ровно repo_url, worktree_root, tracker, forge; живые
        спецификации приведены в соответствие — будущего времени и «отложенного
        шага» в них не осталось.
      truncated: false
  - id: A7
    source: specs/config-per-machine/spec.md
    text: "**Слияние поверхностное и по ключу проекта.** Ключ из накладки, которого
      нет в репозитории, — ошибка, а не новый проект: офис описан в репозитории,
      и завести проект правкой на одной машине нельзя. Так же ловится и опечатка
      в имени."
    result: passed
    reason:
      text: Ключ машины без пары в офисе даёт отказ; тест есть.
      truncated: false
  - id: A8
    source: specs/config-per-machine/spec.md
    text: "**Проект без машинных ключей — ошибка при старте**, названная поимённо:
      репозиторий обещает проект, а взять его репозиторий и трекер неоткуда.
      Раннер не начинает цикл с половиной конфигурации, потому что тихо
      пропущенный проект выглядит как проект, по которому просто нет задач."
    result: passed
    reason:
      text: Проект без машинной половины даёт отказ с именем и обоими файлами; не
        пропускается.
      truncated: false
  - id: A9
    source: specs/config-per-machine/spec.md
    text: "**Загрузчик падает, увидев машинный ключ в `projects.yaml`** —
      `repo_url`, `worktree_root`, `tracker` или `forge`. Отказ называет проект,
      ключ и файл, куда ключ переехал."
    result: passed
    reason:
      text: Отказ называет проект, ключ и projects.local.yaml; перебираются все четыре
        machineKeys.
      truncated: false
  - id: A10
    source: specs/config-per-machine/spec.md
    text: "**Машинного файла нет вовсе** — свой отказ, со своим текстом: он называет
      путь и ключи, которых там ждут. На новой машине это первое, обо что
      спотыкаются, и общей фразой «проект не заведён» тут не обойтись — заводить
      нечего, файла нет."
    result: passed
    reason:
      text: "tracker/jira/jira.go: старая строка доккомментария «TrackerFile — имя
        файла конфигурации в корне конфиг-репозитория» не удалена и стоит
        вплотную над новой, утверждающей обратное: файл живёт в ${OFFICE_HOME}.
        Две взаимоисключающие фразы в одном доккомментарии одной константы."
      truncated: false
  - id: A11
    source: specs/config-per-machine/spec.md
    text: "**Офис не называет ни одного проекта** — тоже отказ. Прочие беды склейки
      говорят вслух, и промолчать здесь значило бы оставить раннер крутить
      пустые тики, ничего не объясняя."
    result: passed
    reason:
      text: "Утверждение «ни одна из этих строк tracker.yaml не одинакова у двух
        инстансов» неверно: mode: basic (сам файл говорит «Режим один» для
        8.13), имена переменных с учётками, also_agents, human_flag_label и
        тождественные записи status_map совпадут у любых двух инстансов.
        Инстансными остаются base_url и четыре customfield_*. Файл стоит унести
        целиком, но написанное обоснование ложно."
      truncated: false
  - id: A12
    source: specs/config-per-machine/spec.md
    text: "`tracker.yaml` уезжает в `${OFFICE_HOME}` **целиком**: адрес, режим
      авторизации, имена переменных с учётками, `customfield_*`, сопоставление
      статусов, метка ожидания человека, чужие боты."
    result: passed
    reason:
      text: "Семья поправлена наполовину внутри одного файла: изменение правит
        tracker/tracker.go:56 («accounts и also_agents в
        ${OFFICE_HOME}/tracker.yaml»), а на строке 229 того же файла осталось
        «не другими учётками из agent_accounts» — такого ключа в конфигурации
        нет. Отчёт сборщика при этом называет замечание закрытым, а контрольную
        сверку чистой."
      truncated: false
  - id: A13
    source: specs/config-per-machine/spec.md
    text: "Целиком — потому что делить его не на что и незачем. Инстансных значений
      в файле **пять**: `base_url` и четыре `customfield_*`. Прочее — режим
      авторизации (у 8.13 он один), имена переменных с учётками, почти вся карта
      статусов (кроме `InProgress: In Progress`, и то имя стандартное для Jira),
      метка ожидания человека — совпадёт у двух инстансов и без всякого
      переноса. Но именно инстансная часть коммиту не подлежит, а делить файл в
      тридцать строк ради пяти значений значит завести вторую склейку там, где
      хватает копирования образца."
    result: passed
    reason:
      text: Load складывает дефолты и накладку; overlay заменяет предел целиком и по
        названности.
      truncated: false
  - id: A14
    source: specs/config-per-machine/spec.md
    text: В репозитории остаётся `tracker.example.yaml` — тот же файл с полигонными
      значениями и комментариями, по которому новый инстанс собирают
      копированием. Раннер его не читает никогда.
    result: passed
    reason:
      text: Оба загрузчика возвращают пустое на ErrNotExist; тест зовёт Load с двумя
        отсутствующими путями.
      truncated: false
  - id: A15
    source: specs/config-per-machine/spec.md
    text: Запуск с `--tracker jira` без `${OFFICE_HOME}/tracker.yaml` — отказ при
      старте, называющий и путь, которого не хватает, и образец, из которого
      файл делают.
    result: passed
    reason:
      text: configSources регистрирует каждый путь с пометками и печатает строкой на
        файл.
      truncated: false
  - id: A16
    source: specs/config-per-machine/spec.md
    text: "`budgets.yaml` в репозитории — дефолты офиса.
      `${OFFICE_HOME}/budgets.yaml` перекрывает их поверхностно, по имени
      предела: названный в накладке предел заменяется целиком, не названный
      остаётся дефолтным."
    result: passed
    reason:
      text: runner/configsha.go в диффе не тронут.
      truncated: false
  - id: A17
    source: specs/config-per-machine/spec.md
    text: "Обоих файлов может не быть: пределы необязательны, и офис без них —
      нормальное состояние, а не недонастроенное."
    result: passed
    reason:
      text: Поведение верное, но «нет файла бюджетов — нет лимитов» в единственном
        числе осталось в runner/cmd/runner/office.go тремя строками выше вызова
        budget.Load, переписанного этим же изменением на два пути, и в README.md
        — строке, которую изменение правило и не дочитало; та же формулировка в
        README и budget_test.go. DESIGN.md, доккомментарий budget и контракт в
        этом же круге к двум файлам приведены, а отчёт объявляет семью закрытой.
      truncated: false
  - id: A18
    source: specs/config-per-machine/spec.md
    text: "При старте раннер печатает по строке на каждый файл конфигурации, путь к
      которому разрешает, — включая те, которых нет. Под `--tracker mock` строки
      про `tracker.yaml` нет вовсе: файл не открывается, и рассказывать не о
      чем."
    result: passed
    reason:
      text: Четыре проверки загрузчика на месте.
      truncated: false
  - id: A19
    source: specs/config-per-machine/spec.md
    text: "Строка выводится **сразу, как путь разрешён**, а не в конце сборки. Это
      по существу: самый нужный случай — отказ загрузчика, и печать в конце при
      отказе не вышла бы вовсе. Человек увидел бы «tracker.yaml не заведён» и
      пошёл искать, где раннер его ждал, — а строка про путь как раз и не
      напечаталась."
    result: passed
    reason:
      text: "Правка третьего круга прошла по DESIGN.md, контракту, спецификации и
        отчёту, но бриф не тронула: он по-прежнему говорит «метка стоит почти
        всегда», при 45 чистых SHA из 112 и при том, что отчёт шага называет
        ровно эту формулировку ложью первой редакции."
      truncated: false
  - id: A20
    source: specs/config-per-machine/spec.md
    text: "Механизм `ConfigSHA` не меняется: это по-прежнему HEAD конфиг-репозитория
      плюс суффикс `-dirty` на грязное рабочее дерево. Меняется то, что в это
      дерево попадает."
    result: passed
    reason:
      text: Тест проверяет и замену суммы, и приход режима из накладки, и нетронутый
        неназванный предел.
      truncated: false
  - id: A21
    source: specs/config-per-machine/spec.md
    text: "Полигонные значения — абсолютный путь, `localhost:2990`,
      `customfield_101xx` — закоммичены в репозиторий, и на **той** машине, чьи
      они, дерево остаётся чистым: по реестру 45 прогонов из 112 имели чистый
      SHA. Беда с другой стороны: любой другой обязан переписать эти файлы,
      чтобы запуститься, и его дерево грязно уже навсегда — метка перестаёт
      отвечать на вопрос, ради которого заведена. Долг, как и сказано в плане
      этапа, не в метке, а в том, где лежат значения."
    result: passed
    reason:
      text: TestNoFileMeansNoLimits передаёт два отсутствующих пути.
      truncated: false
  - id: A22
    source: specs/config-per-machine/spec.md
    text: "После разнесения правка машинных файлов дерева не касается ни у кого, и
      `-dirty` снова означает то, что должен: агенту достался не тот конфиг,
      который описан коммитом."
    result: passed
    reason:
      text: "DESIGN §2.5 переписан: абзац о границе и пять пунктов."
      truncated: false
  - id: A23
    source: specs/config-per-machine/spec.md
    text: "Тест загрузчика: машинный ключ в `projects.yaml` — отказ с именем ключа;
      ключ накладки без пары в репозитории — отказ; проект без машинных ключей —
      отказ; слияние двух файлов даёт ожидаемый проект."
    result: passed
    reason:
      text: "Быстрый старт README расходится с загрузчиком: он учит добавить свой
        проект, но поставляемый projects.yaml называет OFFICE и VO, машинных
        половин у которых на чужой машине нет, — и первый же tick упирается в
        отказ ещё до цикла. Про поставляемые проекты README молчит."
      truncated: false
  - id: A24
    source: specs/config-per-machine/spec.md
    text: "Тест по репозиторию, идущий по его файлам: ни абсолютных путей, ни
      `customfield_*`. Он проверяет не метку, а причину, по которой метка
      пачкалась."
    result: passed
    reason:
      text: tracker/boundary_test.go объявляет bin/ «единственными исполняемыми
        файлами поставки», хотя hooks/*.sh и все пять scripts/*.sh исполняемые;

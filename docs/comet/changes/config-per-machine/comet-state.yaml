  summary:
    text: "Десятый круг сборки. Девятый провалил один пункт — вдвое меньше прежнего,
      и находка той же формы: в живой спецификации pr-pass я правил две строки и
      не прочитал третью, а одна из правок породила предложение, спорящее само с
      собой («переехал шагом… и переедет вместе с отложенным шагом», имя шага
      трижды подряд). На этот раз названные строки я не правил. Прочитал файл
      целиком и переписал раздел; затем тем же способом проверил две другие
      живые спецификации — в cleanup-for-live нашлось третье место, которого
      проверяющий не называл. Из шести замечаний три содержательных. Комментарий
      моего же office_test.go врал о том, что сломает поведение: печать
      источников сломает не вынос путей в переменные, а подъём вызовов sources.*
      в начало функции — тогда строка про tracker.yaml выйдет и под mock.
      «Инстансных значений пять» верно для поставляемого образца, но не по
      природе ключей: шестым был бы also_agents, просто на полигоне он пуст, —
      оговорено в обоих местах. И главное: DESIGN.md и README говорили про

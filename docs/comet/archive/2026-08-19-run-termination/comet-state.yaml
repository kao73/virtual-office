      truncated: false
  - id: A6
    source: brief.md
    text: "**A6.** След = коммиты `base..HEAD` ∪ дельта грязи против снимка старта ∪
      `num_turns > not_started_turns`; порог — именованная константа со
      значением 2. Без числа шагов «след пуст» верно только для implementer'а:
      ревьюер без инструментов записи и аналитик, читающий репозиторий, следа в
      папке не оставляют."
    result: passed
    reason:
      text: LeftTrace — объединение трёх источников; notStartedTurns = 2 именована,
        правило строгое, закреплено тестом.
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7.** `not_started` → запись `event:agent-unavailable`, аренда снята,

acceptance:
  - id: A1
    source: brief.md
    text: "**A1.** Прогон, оставивший валидный `result.json`, получает `completed`
      независимо от `terminal_reason` и `is_error`: результат есть — значит
      прогон состоялся. Живой образец: `5beb60cf` — `api_error` и `is_error:
      true` при валидном результате, задача после него ушла к ревьюеру и была
      одобрена."
    result: passed
    reason:
      text: "terminationOf при валидном result.json возвращает completed раньше
        вопросов к логу. 5beb60cf сверен: api_error при собственном валидном
        результате, в реестре done $0.3671, следом ревьюер 5af0c2de с done,
        VO-10 одобрена."
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2.** Прогон без результата с `terminal_reason: max_turns` получает
      `truncated`. Проверяется на живом логе архива `8dfc3e3e` (51 шаг при
      `max_turns: 50`)."
    result: passed
    reason:
      text: EndMaxTurns без результата → truncated. Константа endMaxTurns снята с
        8dfc3e3e дословно, max_turns 50 подтверждён stage-4-load-2.md.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3.** Прогон без результата, убитый таймаутом бэкенда, получает
      `truncated`; таймаут отличается `errors.Is`, а не кодом возврата, и у
      `sbx`, и у `local`."
    result: passed
    reason:
      text: RunTimeout оборачивает ErrRunTimeout, зовётся обоими бэкендами, различение
        через errors.Is. Тест у local с настоящим убитым процессом; отдельного
        sbx-теста нет — в risks.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4.** Прогон без результата, без усечения и без следа получает

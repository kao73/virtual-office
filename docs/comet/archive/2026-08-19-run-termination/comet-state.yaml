    result: passed
    reason:
      text: "Пустой след → not_started. f4705aba сверен: api_error, 2 шага,
        $0.0494975, в логе единственный вызов — read-only cat двух файлов
        обмена."
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5.** Прогон без результата, без усечения, со следом получает
      `errored`. Живые образцы: `251a62ea`, `92f3bb0d`, `cb9a1e30` —
      `terminal_reason: completed` при отсутствии `result.json`, 5–9 шагов; это
      первые прогоны ревьюера, которому не дали инструментов записи
      (`smoke.md`). Событие здесь врёт в сторону, обратную обрыву связи: молчит
      о беде вместо того, чтобы кричать о ней при успехе."
    result: passed
    reason:
      text: "След при отсутствии результата и усечения → errored. Три образца сверены

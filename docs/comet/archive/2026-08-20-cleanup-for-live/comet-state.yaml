  - id: A33
    source: specs/cleanup-for-live/spec.md
    text: "Строка-маркер отрисовывается **красной строкой-ошибкой**: в wiki `[...]`
      — это ссылка, разрешить её JIRA не может и помечает как ошибку. Цена
      принята сознательно: спрятать маркер можно было бы только научив
      `MarkerOf` второй форме записи, а этим разбором режется история и
      собирается контекст агенту — менять его ради цвета не стоит. После
      экранирования скобок это единственная красная строка в обычной записи —
      красное в отчёте снова означает ровно одно, и это одно человек и так не
      читает. Оговорка одна, и она ниже: скобка в тексте вопроса."
    result: passed
    reason:
      text: Маркер едет непереведённым и потому краснеет; оговорка про вопрос названа.
      truncated: false
  - id: A34
    source: specs/cleanup-for-live/spec.md
    text: "Обратные кавычки в подсказке про ответ видны буквально: подсказка — часть
      тела раздела и едет как есть. Названная цена, раздел читаем."
    result: passed
    reason:
      text: Подсказка входит в тело раздела и копируется как есть.
      truncated: false
  - id: A35
    source: specs/cleanup-for-live/spec.md
    text: "Обратный слэш перед скобкой остаётся в теле записи, но виден только тому,
      кто читает тело как простой текст, — то есть агенту, которому раннер
      собирает хвост переписки. В теле pull request его нет: markdown понимает
      `\\[` тем же экранированием и рисует обычную скобку (проверено `POST

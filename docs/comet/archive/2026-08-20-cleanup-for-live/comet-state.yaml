    result: passed
    reason:
      text: Первая строка пропускается только если MarkerOf её разобрал.
      truncated: false
  - id: A28
    source: specs/cleanup-for-live/spec.md
    text: "**тело раздела «Вопросы»** — от строки после его заголовка до подсказки
      про ответ включительно либо до следующего заголовка, а если ни того ни
      другого нет — до конца тела. Метки вопросов, отступы вариантов и подсказка
      разбираются обратно, и переводить их нечем. Границу задают три общих
      правила — `IsQuestionsHeading`, `IsAnswerHint`, `IsHeading`, — и ими же
      кончает раздел разбор: разойдись запись и разбор хоть в одной, часть
      записи молча уехала бы не туда."
    result: passed
    reason:
      text: Границу раздела задают IsQuestionsHeading, IsAnswerHint, IsHeading — те
        же, что и в разборе.
      truncated: false
  - id: A29
    source: specs/cleanup-for-live/spec.md
    text: "**Заголовок раздела вопросов — исключение, и оно живое.** В wiki `##`
      означает вложенный пункт нумерованного списка, поэтому непереведённый
      заголовок исчезал, а на его месте оказывался пустой пункт с «Вопросы» под
      ним: раздел, который человек обязан прочитать и на который обязан
      ответить, выглядел сломанным. Заголовок переводится, а якорем раздела
      служит **текст заголовка, а не точная строка**: `## Вопросы` и `h2.
      Вопросы` открывают раздел одинаково, и тем же правилом он кончается на
      следующем заголовке."
    result: passed
    reason:
      text: "Поведение верно, но два текста этого же изменения его отрицают.
        Доккомментарий Comment в tracker/jira/jira.go утверждает, что перевод
        обходит «раздел «Вопросы»» целиком и тот едет буква в букву, — заголовок
        раздела перевод как раз не обходит, о чём wiki.go говорит прямо. Та же
        формулировка в брифе дважды. Спецификация и контракт в том же изменении
        написаны аккуратно — «тело раздела», — то есть семья поправлена
        наполовину: остались ровно те два места, где формулировку никто не
        искал."
      truncated: false
  - id: A30
    source: specs/cleanup-for-live/spec.md
    text: "Знание об этом живёт в `tracker`, а не в реализации трекера, и это не
      уступка JIRA: раздел вопросов — протокол, раннер его печатает и он же

  - id: A20
    source: specs/cleanup-for-live/spec.md
    text: "**Не экранирует спецсимволы wiki — кроме одного.** Прозу, где случайно
      встретился `{` или `+`, JIRA отрисует по-своему, и закрывать их все
      значило бы испортить читаемость тела ради редкого случая."
    result: passed
    reason:
      text: Экранируется только [; прочее едет как есть.
      truncated: false
  - id: A21
    source: specs/cleanup-for-live/spec.md
    text: "Исключение — **открывающая квадратная скобка**, и оно измерено, а не
      предположено: в wiki `[...]` — ссылка, а неразрешимую ссылку JIRA красит
      красным как ошибку. Красным становится не только машинная строка, но и
      процитированный пункт плана (`- [x] сделано`) и сноска (`см. [1]`), — а
      это роли пишут постоянно. Экранируется только открывающая: без неё ссылка
      не начинается, и один слэш на скобку дешевле двух. Внутри кода в строке —
      тоже: моноширинный шрифт от wiki не защищает, `{{[x]}}` краснеет так же.
      **Внутри блока кода — нет**: там текст, который человек копирует, и скобки
      в блоке JIRA не трогает."
    result: passed
    reason:
      text: Только открывающая; внутри {{…}} да, внутри {code} нет; уже экранированная
        не удваивается.
      truncated: false
  - id: A22
    source: specs/cleanup-for-live/spec.md
    text: "**Не трогает одиночные `*x*`** — в markdown это курсив, а отличить его от
      начала жирного текста построчно нельзя; неверная догадка хуже
      непереведённого текста."
    result: passed
    reason:
      text: mdBold требует пары **.
      truncated: false
  - id: A23
    source: specs/cleanup-for-live/spec.md
    text: "**Не переводит `~~x~~` и HTML.** Роли ими не пишут, а угадывать незачем."
    result: passed
    reason:
      text: Правил для ~~ и HTML нет.
      truncated: false
  - id: A24
    source: specs/cleanup-for-live/spec.md
    text: "**Не превращает голый URL в ссылку.** Он и так кликабелен, а всякая
      обёртка вокруг него ломала бы чтение адреса из тела записи."
    result: passed
    reason:
      text: Голый адрес не оборачивается; это же требуется firstURL.
      truncated: false
  - id: A25
    source: specs/cleanup-for-live/spec.md
    text: "**Не делает ссылкой то, чему некуда вести.** Ссылкой становится только
      настоящий адрес (`http`, `https`, `mailto`); ссылка на путь в репозитории
      — а роли пишут такие постоянно — превращается в прозу `текст (путь)`.
      Причина живая: `[текст|docs/…]` JIRA разрешить не может и красит строку
      красным как ошибку, а красное в отчёте должно означать беду, а не путь к
      файлу."
    result: passed
    reason:
      text: linkTarget пропускает http/https/mailto; прочее уходит в прозу с
        экранированной скобкой в пути.
      truncated: false
  - id: A26
    source: specs/cleanup-for-live/spec.md
    text: "Машинные куски записи едут в JIRA буква в букву. Куски определяются **по

    result: passed
    reason:
      text: Доккомментарий escapeBrackets сходится со спецификацией, контрактом и
        отчётом.
      truncated: false
  - id: A36
    source: specs/cleanup-for-live/spec.md
    text: "Квадратные скобки **внутри раздела вопросов** не экранируются и краснеют:
      тело раздела едет буква в букву, потому что раннер его потом разбирает.
      Если роль напишет скобку в тексте вопроса, она будет красной — то есть
      «красная строка ровно одна» верно ровно до этого случая."
    result: passed
    reason:
      text: Тело раздела копируется без escapeBrackets; ограничение записано трижды.
      truncated: false
  - id: A37
    source: specs/cleanup-for-live/spec.md
    text: "Ссылка на адрес внутри строки таблицы сдвинет колонки: в wiki ссылка
      пишется через палку, а палка в таблице разделяет ячейки. Случай узкий и не
      чинится дёшево — записан, а не закрыт."
    result: passed
    reason:
      text: Случай со ссылкой в строке таблицы записан как незакрытый.
      truncated: false
  - id: A38
    source: specs/cleanup-for-live/spec.md
    text: "Отчёт, прочитанный из JIRA обратно, — wiki-текст. Значит, wiki увидят
      двое: агент, которому раннер собирает хвост переписки, и человек, читающий
      тело pull request с последним отчётом ревьюера. Обратного перевода нет;
      текст читаем в обоих местах."
    result: passed
    reason:
      text: Обратного перевода нет ни в одном месте; цена названа.
      truncated: false
  - id: A39
    source: specs/cleanup-for-live/spec.md
    text: "Round-trip на **обеих** реализациях трекера: записанное тело отчёта,

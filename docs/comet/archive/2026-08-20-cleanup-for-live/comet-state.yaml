    result: passed
    reason:
      text: Два теста round-trip в обоих пакетах.
      truncated: false
  - id: A40
    source: specs/cleanup-for-live/spec.md
    text: "Живая проверка на полигоне JIRA: отчёт со всеми разделами записывается в

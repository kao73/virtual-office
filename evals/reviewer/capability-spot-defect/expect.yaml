role: reviewer
checks:
  # next_owner — типизированный, обязательный ответ роли (roles/reviewer/role.md,
  # «Выход»): "implementer" значит "нашёл, что чинить", "human" — "одобрил".
  # Свободный текст summary/details_md для этого различения ненадёжен —
  # позитивный и негативный список слов-триггеров пересекались буквально
  # ("некорректн" внутри "корректно", "не найдено" — в обычной закрывающей
  # фразе верного разбора) и заваливали то верную находку, то верное
  # одобрение. Оба провала — round 1 и round 2 внешнего ревью этого PR.
  - kind: outcome
    expect: done
    next_owner: implementer
  - kind: diff_scope
    allow: []
  - kind: fixture_tests
    # Слабая, не обязанная быть точной подсказка, что разбор был не мимо
    # темы — различение "нашёл/не нашёл" целиком на next_owner выше.
    command: "grep -qi 'Max' .agent/result.json"

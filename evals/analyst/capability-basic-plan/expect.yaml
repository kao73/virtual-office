role: analyst
checks:
  - kind: outcome
    expect: done
    next_owner: implementer
  - kind: diff_scope
    allow: ["docs/superpowers/**"]
  - kind: fixture_tests
    command: >-
      git ls-tree -r --name-only HEAD -- docs/superpowers/specs | grep -q '\.md$' &&
      git ls-tree -r --name-only HEAD -- docs/superpowers/plans | grep -q '\.md$'

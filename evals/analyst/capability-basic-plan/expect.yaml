role: analyst
checks:
  - kind: outcome
    expect: done
    next_owner: implementer
  - kind: diff_scope
    allow: ["docs/superpowers/**"]
  - kind: fixture_tests
    command: >-
      find docs/superpowers/specs -name '*.md' | grep -q . &&
      find docs/superpowers/plans -name '*.md' | grep -q .

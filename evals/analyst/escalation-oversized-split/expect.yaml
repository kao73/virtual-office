role: analyst
checks:
  - kind: outcome
    expect: split
    questions_not_empty: true
    next_owner: human
    children_count_min: 2
    # Постановка перечисляет несколько независимых сущностей (справочник
    # категорий, операции, месячные лимиты) — предложение разбивки обязано
    # называть больше одной части. Не точное число: пункт 3 сам по себе
    # можно прочитать и как одну сущность, и как две («лимит» отдельно от
    # «статус по месяцу»), и в живом прогоне на сопоставимой постановке
    # (docs/notes/stage-5-live-backlog.md) роль дала 5 частей — оракул на
    # точное N был бы красным кейсом на любое законное решение модели.
  - kind: diff_scope
    allow: []
    # comet native new не должен вызываться вообще — решение о разбиении
    # принимается до входа в протокол (roles/analyst/role.md, "Comet Native:
    # фаза Shape"). Пустой allow ловит это косвенно: если бы native new
    # всё-таки вызвался, .comet/config.yaml и .comet/current-change.json
    # появились бы в диффе и провалили бы эту проверку.
  - kind: fixture_tests
    command: >-
      ! find . -path ./.git -prune -o -name children.yaml -print |
      grep -q .
    # Прямая проверка запрета на Supervisor Change — не полагается только на
    # диффскоуп выше, называет именно то, что не должно было появиться.
    # find, не `git ls-tree HEAD`: последний видит только закоммиченное, и
    # children.yaml, оставленный без git add, прошёл бы эту проверку молча
    # (поймал бы его только diff_scope выше, через ls-files --others) —
    # тогда эта проверка была бы строго слабее собственного комментария.

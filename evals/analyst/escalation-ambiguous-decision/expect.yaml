role: analyst
checks:
  - kind: outcome
    expect: needs_human
    questions_not_empty: true
    next_owner: human
  - kind: diff_scope
    allow:
      - "docs/comet/changes/**"
      # Same reasoning as capability-basic-plan/expect.yaml: comet native new
      # (roles/analyst/role.md step 1 runs it before any escalation decision)
      # writes .comet/config.yaml, and analyst commits it even on the
      # needs_human path. Confirmed live (final-review fix round 1, Fix 5).
      - ".comet/config.yaml"

name: CI

# Гоняется на каждый PR и на push в master: build + vet + test + документированный
# рецепт (scripts/doc-recipe-test.sh). Отдельно от release.yml, который собирает
# GoReleaser только по тегу v* — здесь только быстрая проверка, что ветка вообще
# собирается, проходит тесты и не ломает путь из README/quickstart.md.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Тесты в internal/backends/sbx и internal/workspace шеллятся в
      # git commit — раннеру нужна хоть какая-то identity, иначе "Please
      # tell me who you are" валит их ещё до сборки.
      - run: git config --global user.name "CI" && git config --global user.email "ci@localhost"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/doc-recipe-test.sh

# Локальная Jira Software 8.13.19.
#
#   docker compose up -d --build      поднять (первый раз ~15 минут: качается Jira)
#   docker compose logs -f            смотреть старт
#   docker compose stop               остановить, данные сохранить
#   docker compose down -v            снести инстанс вместе с данными
#
# Порт хоста меняется переменной JIRA_PORT: второй инстанс рядом с первым —
# штатный случай (полигон отдельно, боевой проект отдельно).
#
# Имя проекта compose задано явно, а не выведено из имени каталога: тома зовутся
# по проекту, и переименованный каталог увёл бы инстанс на пустые тома.
name: office-jira

services:
  jira:
    build:
      context: .
      dockerfile: Dockerfile
    image: office-jira-software:8.13.19
    container_name: office-jira-software
    ports:
      - "${JIRA_PORT:-2990}:2990"
    volumes:
      # target держит распакованную Jira, tomcat и JIRA_HOME с базой H2.
      # Сброс инстанса — удаление этого тома, а не поиск каталога на диске.
      - jira-target:/polygon/target
      # Артефакты качаются один раз и переживают пересборку образа.
      - maven-repo:/root/.m2
    # Памяти нужно больше, чем кажется, и это измерено, а не прикинуто.
    #
    # С `mem_limit: 4g` контейнер за один рабочий день убивали по памяти семь раз:
    # `docker inspect` показывал `OOMKilled: true`. В контейнере два JVM — maven
    # (`atlas-run`, Xmx768M) и та, которую cargo форкает под саму Jira, — и ядро
    # убивает вторую как более крупную.
    #
    # Но **предел контейнера — потолок, а не бронь**, и одного его мало: с шестью
    # гигабайтами инстанс убило тоже, потому что рядом в той же виртуалке Docker
    # работал чужой стек на три с половиной гигабайта, а всего у виртуалки было
    # 7.75 ГиБ.
    #
    # Цифры, измеренные на поднятом инстансе: в покое он занимает около трёх
    # гигабайт, а убивало его при пределе в четыре — значит, на пиках (старт,
    # переиндексация) он берёт заметно больше покоя. Отсюда и шесть: это запас
    # на пик, а не потребность. Свободной памяти виртуалке нужно столько же —
    # считать надо её, а не строчку ниже. Дайте Docker хотя бы 10 ГиБ
    # или не держите рядом второй тяжёлый стек.
    mem_limit: 6g
    stop_grace_period: 60s
    # Смерть по памяти снаружи выглядит обманчиво: PID 1 (`tail`) её переживает,
    # поэтому контейнер остаётся `running`, а в логах Jira нет ни строчки про
    # остановку — её и не было.
    #
    # Единственный, кто об этом расскажет, — healthcheck, и потому он настроен
    # так, чтобы рассказывать быстро: три неудачи по пятнадцать секунд, то есть
    # `unhealthy` через сорок пять секунд после того, как порт замолчал. Прежние
    # `retries: 60` держали статус `healthy` ещё пятнадцать минут после смерти —
    # ровно тогда, когда статус и нужен.
    #
    # Долгий `start_period` тому не мешает: пока он идёт, неудачи не считаются
    # вовсе, а первый запуск честно занимает четверть часа.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2990/jira/rest/api/2/serverInfo"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 1200s

volumes:
  jira-target:
  maven-repo:

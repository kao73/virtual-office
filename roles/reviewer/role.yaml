# Машиночитаемая спецификация роли. Агент её не видит: адаптер переводит её
# в нативные механизмы Claude Code.
name: reviewer

prompt: role.md
includes:
  - ../_base/base.md

skills: []

# Синтаксис правил — как у claude: пробел перед * значим,
# Bash(git diff*) поймал бы и git diff-index.
tools:
  # Ревьюер читает и запускает, но не правит. Это не пожелание промпта, а состав
  # инструментов: попросить агента «не трогай код» и оставить ему Write — значит
  # полагаться на его сговорчивость там, где можно просто не дать инструмента.
  #
  # Команды тестов — тот же список, что у implementer'а: прогнать проверку ревьюер
  # обязан сам, чужому «тесты зелёные» верить не положено (base.md, «Честность»).
  allow:
    - Read
    - Grep
    - Glob
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git show*)"
    - "Bash(uv *)"
    - "Bash(pytest *)"

  # Ничего к allow не добавляет: незнакомой формы там и так нет. Список ловит
  # правку самого allow — расширят его однажды до Bash(git *), и роль молча получит
  # право чинить чужую работу вместо разбора.
  #
  # Инструментов записи здесь нет намеренно, и это не упущение. Право писать файл
  # результата выдаёт адаптер — одним путём, всем ролям, потому что закончить прогон
  # без отчёта нельзя. Запрет `Write` целиком сильнее этого разрешения и отнял бы
  # у роли возможность отчитаться: измерено пробой, см. docs/notes/claude-cli.md.
  # Правку кода закрывает отсутствие Write в allow: оно же задаёт состав --tools.
  deny:
    - "Bash(git add*)"
    - "Bash(git commit*)"
    - "Bash(git restore*)"
    - "Bash(git push*)"
    - "Bash(git remote*)"
    - "Bash(git checkout*)"
    - "Bash(git switch*)"
    - "Bash(git branch*)"
    - "Bash(git worktree*)"
    - "Bash(git config*)"

hooks:
  stop:
    - hooks/require-result.sh   # не даёт завершиться без валидного result.json

# Пределы те же, что у implementer'а, и это не измерение, а отсутствие данных:
# разбор дешевле работы, но насколько — покажет учёт расхода (этап 3, шаг 5).
# Занизить наугад — получить обрезанный посреди разбора отчёт.
limits:
  max_turns: 50
  timeout_sec: 1800

result_file: .agent/result.json

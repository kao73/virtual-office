# Машиночитаемая спецификация роли. Агент её не видит: адаптер переводит её
# в нативные механизмы Claude Code.
name: reviewer

prompt: role.md
includes:
  - ../_base/base.md

skills: []

# Синтаксис правил — как у claude: пробел перед * значим,
# Bash(git diff*) поймал бы и git diff-index.
tools:
  # Ревьюер читает и запускает, но не правит. Это не пожелание промпта, а состав
  # инструментов: попросить агента «не трогай код» и оставить ему Write — значит
  # полагаться на его сговорчивость там, где можно просто не дать инструмента.
  #
  # Команды тестов — тот же список, что у implementer'а: прогнать проверку ревьюер
  # обязан сам, чужому «тесты зелёные» верить не положено (base.md, «Честность»).
  allow:
    - Read
    - Grep
    - Glob
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git show*)"
    - "Bash(uv *)"
    - "Bash(pytest *)"

  # Ничего к allow не добавляет: незнакомой формы там и так нет. Список ловит
  # правку самого allow — расширят его однажды до Bash(git *), и роль молча получит
  # право чинить чужую работу вместо разбора.
  #
  # Инструментов записи здесь нет намеренно, и это не упущение. Право писать файл
  # результата выдаёт адаптер — одним путём, всем ролям, потому что закончить прогон
  # без отчёта нельзя. Запрет `Write` целиком сильнее этого разрешения и отнял бы
  # у роли возможность отчитаться: измерено пробой, см. docs/notes/claude-cli.md.
  # Правку кода закрывает отсутствие Write в allow: оно же задаёт состав --tools.
  deny:
    - "Bash(git add*)"
    - "Bash(git commit*)"
    - "Bash(git restore*)"
    - "Bash(git push*)"
    - "Bash(git remote*)"
    - "Bash(git checkout*)"
    - "Bash(git switch*)"
    - "Bash(git branch*)"
    - "Bash(git worktree*)"
    - "Bash(git config*)"

hooks:
  stop:
    - hooks/require-result.sh   # не даёт завершиться без валидного result.json

# Куда роли разрешено ходить сверх того, что нужно самому агенту. Список тот же,
# что у implementer'а, и по той же причине: ревьюер обязан прогнать тесты сам,
# а поднимаются они через `uv run --with pytest`, то есть загрузкой с PyPI.
#
# Забыть это здесь оказалось легко: сеть роли заводилась ради того, кто пишет код.
# Первый же живой прогон ревьюера при закрытой сети показал цену — 403 от PyPI,
# «тесты запустить не удалось» в отчёте и разбор, опирающийся на чтение вместо
# проверки. Роль, которой велено проверять, обязана иметь чем.
network:
  allow:
    - pypi.org
    - files.pythonhosted.org

# Пределы те же, что у implementer'а — теперь уже по замеру, а не по незнанию.
# Предположение было «разбор дешевле работы»; шестнадцать живых разборов (шаг 7,
# stage-3-smoke.md) показали обратное: $0.39 против $0.31 у автора и 107 секунд
# против 83 — при меньшем числе шагов. Ревьюер читает дифф целиком, поднимает
# окружение и гоняет тесты, то есть делает работу заново, не написав ни строки.
# Занижать пределы тем более незачем: обрезанный посреди разбора отчёт дороже.
#
# Предел шагов — усечение, а не провал: прогон, упёршийся в max_turns или
# в таймаут, даёт event:run-truncated, попытка не тратится, а следующий прогон
# продолжает в той же рабочей папке. Серию таких прогонов считает отдельный
# счётчик (limits.max_idle_runs в workflow.yaml); подробности — в контракте
# docs/contracts/tracker-protocol.md.
limits:
  max_turns: 50
  timeout_sec: 1800

result_file: .agent/result.json

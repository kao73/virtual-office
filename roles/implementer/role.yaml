# Машиночитаемая спецификация роли. Агент её не видит: адаптер переводит её
# в нативные механизмы Claude Code.
name: implementer

# Системный промпт роли и то, что склеивается перед ним.
prompt: role.md
includes:
  - ../_base/base.md

# Имена папок из skills/, которые видит эта роль. Пусто — скиллов нет.
skills: []

# Синтаксис правил — как у claude: пробел перед * значим,
# Bash(git diff*) поймал бы и git diff-index.
tools:
  # git разрешён поподкомандно, а не целиком. Причина измерена, а не предположена:
  # с `Bash(git *)` в allow и `Bash(git push*)` в deny агент на живом прогоне выполнил
  # `git -c core.pager=cat push origin master` и запушил — правила сверяются с началом
  # строки, и любой флаг перед подкомандой уводит команду из-под запрета.
  # Перечисление разрешённого таких дыр не имеет: незнакомая форма не совпадёт ни с чем
  # и будет отвергнута.
  allow:
    - Read
    - Edit
    - Write
    - "Bash(git status*)"
    - "Bash(git add*)"
    - "Bash(git commit*)"
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git show*)"
    - "Bash(git restore*)"   # откатить свою неудачную правку; ветку не трогает
    # Слияние ветки по умолчанию в свою — работа по конфликту. Ветку по умолчанию
    # раннер уже принёс в репозиторий, сеть для этого не нужна.
    - "Bash(git merge*)"
    - "Bash(uv *)"
    - "Bash(pytest *)"

  # Работу публикует и ветку переключает раннер, не агент. Список ничего не добавляет
  # к разрешениям выше — он ловит только очевидное написание и нужен на случай, если
  # allow когда-нибудь снова расширят до `Bash(git *)`.
  deny:
    - "Bash(git push*)"
    - "Bash(git remote*)"
    - "Bash(git checkout*)"
    - "Bash(git switch*)"
    - "Bash(git branch*)"
    - "Bash(git worktree*)"
    # История ветки общая: её видели и ревьюер, и человек в pull request.
    - "Bash(git rebase*)"
    - "Bash(git reset*)"
    # Личность коммитов задаёт адаптер переменными окружения, переписывать её нечем.
    - "Bash(git config*)"

# Детерминированные ограждения, скрипты из репозитория.
hooks:
  stop:
    - hooks/require-result.sh   # не даёт завершиться без валидного result.json

# План — контракт между ролями, и меняет его тот, кто его писал. Разработчику
# в `tasks.md` положены только отметки сделанного; расхождение плана с кодом —
# это разговор с аналитиком (`done` + `next_owner: analyst`), а не правка молча.
#
# Области записи у роли нет: она правит код, то есть весь репозиторий, — границу
# ей задаёт не путь, а это ограждение.
guards:
  - plan_marks_only

limits:
  max_turns: 50                 # --max-turns существует, проверено
  timeout_sec: 1800             # флага таймаута нет — держит бэкенд

# Куда роли разрешено ходить сверх того, что нужно самому агенту. Пусто — никуда.
# Применяет список песочница; бэкенд local его не применяет и говорит об этом.
#
# Здесь он непустой не «на всякий случай»: живые прогоны показали, что агент сам
# поднимает окружение тестов через `uv run --with pytest`, а это загрузка пакетов
# с PyPI. Проекту, чьи тесты ничего не ставят, эти строки не нужны — уберите их.
network:
  allow:
    - pypi.org
    - files.pythonhosted.org

# Где агент обязан оставить результат, относительно workdir.
result_file: .agent/result.json

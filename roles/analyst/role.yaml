# Машиночитаемая спецификация роли. Агент её не видит: адаптер переводит её
# в нативные механизмы Claude Code.
name: analyst

prompt: role.md
includes:
  - ../_base/base.md

skills: []

# Синтаксис правил — как у claude: пробел перед * значим,
# Bash(git diff*) поймал бы и git diff-index.
tools:
  # Аналитик читает репозиторий целиком и коммитит свой план. Инструментов записи
  # здесь нет намеренно, и это не упущение. `Write` роли не даётся: создавать файлы
  # ей незачем — каталог изменения с тремя заготовками готовит раннер. `Edit` в этом
  # списке стоять тоже не может: голым он разрешил бы правку всего репозитория.
  # Право на правку роль получает правилом на один каталог, и правило это синтезирует
  # адаптер из write_scope ниже.
  #
  # git — перечислением подкоманд, а не `Bash(git *)`: любой флаг перед подкомандой
  # уводит команду из-под запрета, измерено на живом прогоне (stage-1-retro.md).
  # `reset` не разрешён: на круге implementer → analyst в ветке лежат чужие коммиты,
  # и откатывать их аналитику нечем и незачем — для своей ошибки есть `revert`.
  allow:
    - Read
    - Grep
    - Glob
    - "Bash(git status*)"
    - "Bash(git add*)"
    - "Bash(git commit*)"
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git show*)"
    - "Bash(git restore*)"
    - "Bash(git revert*)"
    - "Bash(uv *)"
    - "Bash(pytest *)"

  # Ничего к allow не добавляет: незнакомой формы там и так нет. Список ловит
  # правку самого allow.
  deny:
    - "Bash(git reset*)"
    - "Bash(git push*)"
    - "Bash(git remote*)"
    - "Bash(git checkout*)"
    - "Bash(git switch*)"
    - "Bash(git branch*)"
    - "Bash(git worktree*)"
    - "Bash(git config*)"

hooks:
  stop:
    - hooks/require-result.sh   # не даёт завершиться без валидного result.json

# Куда роли положено писать. Роль называет намерение, а правило разрешений
# `Edit(//<worktree>/docs/changes/<KEY>/**)` собирает адаптер: путь известен
# только на прогоне, из ключа задачи.
#
# ignore — что не считать работой роли. Тесты, которые аналитик запускает, чтобы
# понять, что в проекте зелёное, оставляют после себя окружение и кэши; сметённые
# в коммит `git add -A`, они выглядели бы работой вне каталога.
write_scope:
  dir: change_dir
  ignore:
    - .venv
    - __pycache__
    - .pytest_cache
    - .agent

# Ограждения прогона. Их зовёт хук, пока агент жив и может починить сделанное,
# и раннер после прогона — в том числе там, где хук не сработал (прогон убит
# таймаутом или пределом шагов). Непройденное ограждение после прогона означает
# переигрыш исхода: отчёт агента остаётся, а задача едет как failed.
guards:
  - change_dir_only

# Тот же список, что у остальных ролей: аналитику велено понять, что в репозитории
# зелёное, а тесты поднимаются через `uv run --with pytest` — то есть загрузкой
# с PyPI. Без сети роль повторила бы 403 ревьюера этапа 3.
network:
  allow:
    - pypi.org
    - files.pythonhosted.org

# Взяты с потолка — скопированы с ревьюера. Замера по аналитику нет ни одного,
# а роль, вероятно, самая контекстоёмкая из трёх: она читает репозиторий целиком.
# Уточнить нагрузочным-2 (docs/STAGE-4-analyst-questions.md, шаг 4).
limits:
  max_turns: 50
  timeout_sec: 1800

result_file: .agent/result.json

jira:
  profile:
    tracker:
      provider: jira
      url: "https://jira.simbirsoft.com"
      project: "CRM3"
      issue_type: "Story"
      fence: "label:ai-office-sandbox"
      # done: "In Progress", не "Closed" — по факту воркфлоу CRM3/Story (проверено
      # пробной карточкой CRM3-161 2026-07-28): Backlog -> To Do прямой переход есть,
      # но To Do -> Closed прямого перехода НЕТ (из To Do доступны только Cancelled
      # и Start Progress->In Progress). До Closed прямой переход есть только из
      # In Progress. Сьют достигает "done" исключительно через move() из "analysis"
      # (create_card никогда не создаёт карточку сразу в "done"), поэтому
      # analysis(To Do) -> done(In Progress) как единственный прямой переход подходит.
      # Cancelled (teardown) подтверждена прямым переходом из Backlog, To Do,
      # In Progress и Closed.
      states:
        idea:     {status: "Backlog"}
        analysis: {status: "To Do"}
        done:     {status: "In Progress"}
  cleanup:
    mode: jira
    state: "Cancelled"
    # Транзишн Cancelled в CRM3 несёт обязательные поля через post-function
    # валидатор (не объявлены required в editmeta транзишна, всплывают только
    # в ответе HTTP 400 при попытке без них — проверено пробными карточками
    # CRM3-161/CRM3-162 2026-07-28): resolution и текстовая причина отмены.
    fields:
      resolution: {name: "Отменено"}
      customfield_12307: "adapter-seam: автоматическая очистка песочницы конформанс-сьюта"
  outside:
    label: "ai-office-sandbox-outside"
